name: Build public data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-public-data.yml"
      - "tools/data/**"
      - "docs/brand/**"
      - "app/src/main/res/raw/eye.json"
  # Refresh the published static dataset once per day, even when no code changes land.
  schedule:
    - cron: "17 3 * * *"
  repository_dispatch:
    types: [upstream_dataset_changed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: citizeneye-public-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        if: ${{ hashFiles('tools/data/requirements.txt') != '' }}
        run: |
          if [ -s tools/data/requirements.txt ]; then
            python -m pip install -r tools/data/requirements.txt
          fi

      - name: Build CitizenEye public dataset
        run: python tools/data/build_citizeneye_dataset.py --out public

      - name: Add marketing index and assets
        run: |
          cp tools/data/public-index.html public/index.html
          mkdir -p public/assets/screenshots public/assets/brand
          cp docs/screenshots/*.svg public/assets/screenshots/
          cp app/src/main/res/raw/eye.json public/assets/brand/eye.json
          cp docs/brand/citizeneye-eye.svg public/assets/brand/citizeneye-eye.svg
          python tools/data/build_release_notes_page.py --out public/release-notes/index.html

      - name: Preserve latest APK update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases/latest',
              headers={'Authorization': f"Bearer {os.environ.get('GH_TOKEN', '')}", 'Accept': 'application/vnd.github+json'}
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  release = json.load(response)
          except Exception as error:
              print(f'No latest release update manifest preserved: {error}')
              raise SystemExit(0)
          asset = next((a for a in release.get('assets', []) if a.get('name') == 'update.json'), None)
          if not asset:
              print('Latest release has no update.json asset')
              raise SystemExit(0)
          req = urllib.request.Request(
              asset['browser_download_url'],
              headers={'Authorization': f"Bearer {os.environ.get('GH_TOKEN', '')}"}
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = response.read()
          parsed = json.loads(data.decode('utf-8'))
          if not str(parsed.get('apkUrl', '')).startswith('https://'):
              raise SystemExit('Refusing update.json with non-HTTPS apkUrl')
          with open('public/update.json', 'wb') as f:
              f.write(data)
          print('Preserved latest release update.json')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
