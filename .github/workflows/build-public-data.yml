name: Build public data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [upstream_dataset_changed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: citizeneye-public-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        if: ${{ hashFiles('tools/data/requirements.txt') != '' }}
        run: |
          if [ -s tools/data/requirements.txt ]; then
            python -m pip install -r tools/data/requirements.txt
          fi

      - name: Build CitizenEye public dataset
        run: python tools/data/build_citizeneye_dataset.py --out public

      - name: Add minimal index
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <meta charset="utf-8">
            <title>CitizenEye public data</title>
            <body>
              <h1>CitizenEye public data</h1>
              <p>Static public-data files generated from official Assemblée nationale open data.</p>
              <p><a href="manifest.json">manifest.json</a></p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
